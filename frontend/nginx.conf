server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # API calls go to the backend container (service name from docker-compose.yml).
  location /api/ {
    proxy_pass http://backend_api:4000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Single-page application: unknown paths fall back to index.html so React Router can handle them.
  location / {
    try_files $uri /index.html;
  }
}
